name: Contact Hub RC

on:
  pull_request:
    branches:
      - contact-hub
      - main
  push:
    branches:
      - contact-hub
      - 'fix/contact-hub-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Worker unit, lint, dry-run build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - name: Install Worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile
      - name: Worker tests
        working-directory: worker
        run: pnpm test
      - name: Worker lint
        working-directory: worker
        run: pnpm run lint
      - name: Worker dry-run build
        working-directory: worker
        run: pnpm run build
      - name: Validate Contact Hub named environment deployment config
        working-directory: worker
        run: |
          if grep -Eq '^[[:space:]]*(JWT_SECRET|ADMIN_PASSWORDS|CONTACT_[A-Z0-9_]*(API_KEY|PASSWORD)|CLOUDFLARE_API_TOKEN)[[:space:]]*=' wrangler.toml.template; then
            echo "Secret-like values must not be assigned in wrangler.toml.template" >&2
            exit 1
          fi
          cp wrangler.toml.template wrangler.toml
          python - <<'PYCONFIG'
          from pathlib import Path
          path = Path("wrangler.toml")
          text = path.read_text()
          text = text.replace("<STAGING_D1_ID>", "00000000-0000-0000-0000-000000000001")
          text = text.replace("<PRODUCTION_D1_ID>", "00000000-0000-0000-0000-000000000002")
          path.write_text(text)
          PYCONFIG
          mkdir -p ../frontend/dist
          printf '<!doctype html><title>contact-hub-ci</title>' > ../frontend/dist/index.html
          pnpm run dry-run:staging
          pnpm run dry-run:production

  frontend:
    name: Frontend unit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: frontend
        run: pnpm test -- --run
      - name: Frontend production build
        working-directory: frontend
        run: pnpm run build
      - name: Frontend Contact Hub same-origin build
        working-directory: frontend
        run: pnpm run build:pages

  contact-and-temp-e2e:
    name: Contact + Temp Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E runner dependencies
        working-directory: e2e
        run: npm ci
      - name: Validate Compose configuration
        working-directory: e2e
        run: docker compose config --quiet
      - name: Run Contact and Temp regression suite
        working-directory: e2e
        run: npm test
      - name: Upload Playwright reports and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: contact-hub-rc-playwright-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup Compose resources
        if: always()
        working-directory: e2e
        run: docker compose down -v
